[project]
name = "tickfold"
version = "0.1.0"
description = "Limit order book stream storage format and public benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "websockets",
    "aiohttp",
    "zstandard",
    "numpy"
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.4.0",
]
model = [
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
]
screen = [
    "streamlit",
    "plotly",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tickfold*"]

[tool.setuptools.package-data]
"tickfold.screen" = ["*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
